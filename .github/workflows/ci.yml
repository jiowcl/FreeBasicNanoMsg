name: FreeBASIC NanoMsg CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  linux-build:
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install System Dependencies & nanomsg
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc make libncurses5 libffi-dev libnanomsg-dev

    - name: Install FreeBASIC Compiler (fbc)
      run: |
        URL="https://sourceforge.net/projects/fbc/files/FreeBASIC-1.10.1/Binaries-Linux/FreeBASIC-1.10.1-ubuntu-22.04-x86_64.tar.gz/download"
        curl -s -L "$URL" | tar -xz

        cd FreeBASIC-1.10.1-ubuntu-22.04-x86_64
        sudo ./install.sh -i

        fbc -version

    - name: Compile all FreeBasicNanoMsg examples
      run: |
        set -euo pipefail
        ex="./FreeBasicNanoMsg/Example"
        out="$ex/_ci_out"
        mkdir -p "$out"

        files=(
          Nanomsg.bas
          PubServer.bas
          SubClient.bas
          RepServer.bas
          ReqClient.bas
          PushServer.bas
          PullClient.bas
          SurveyorServer.bas
          RespondentClient.bas
          PairInproc.bas
          Module/PubServer.bas
          Module/SubClient.bas
          Module/RepServer.bas
          Module/ReqClient.bas
          Module/PushServer.bas
          Module/PullClient.bas
          Module/SurveyorServer.bas
          Module/RespondentClient.bas
          Module/PairInproc.bas
        )

        failed=0
        for f in "${files[@]}"; do
          name="${f//\//-}"
          name="${name%.bas}"
          echo "=== Compiling $f ==="
          if ! fbc -w all "$ex/$f" -x "$out/$name"; then
            echo "FAILED: $f"
            failed=1
          else
            echo "OK: $f"
          fi
        done

        if [ "$failed" -ne 0 ]; then
          echo "One or more FreeBasicNanoMsg examples failed to compile."
          exit 1
        fi
        echo "Compiled ${#files[@]} FreeBasicNanoMsg examples."

    - name: Compile and run FreeBasicNanoMsg smoke test
      working-directory: ./FreeBasicNanoMsg
      run: |
        fbc -w all Test/Smoke.bas -x Test/Smoke
        ./Test/Smoke
        test $? -eq 0

    - name: Compile FreeBasicNNG Tests
      run: |
        fbc -w all ./FreeBasicNNG/Test/NngTest.bas -x ./FreeBasicNNG/Test/FreeBasicNNG_Test

  windows-runtime:
    runs-on: windows-2022
    timeout-minutes: 20

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install FreeBASIC Compiler (fbc64)
      shell: pwsh
      run: |
        $archive = Join-Path $env:RUNNER_TEMP "FreeBASIC-1.10.1-win64.zip"
        $url = "https://sourceforge.net/projects/fbc/files/FreeBASIC-1.10.1/Binaries-Windows/FreeBASIC-1.10.1-win64.zip/download"
        # SourceForge returns HTML to Invoke-WebRequest; curl -L gets the real archive.
        curl.exe -fsSL -o $archive $url

        $header = [System.IO.File]::ReadAllBytes($archive)
        if ($header.Length -lt 1MB -or $header[0] -ne 0x50 -or $header[1] -ne 0x4B) {
          throw "FreeBASIC download is not a ZIP (size=$($header.Length) bytes). Check SourceForge URL."
        }

        $installRoot = Join-Path $env:RUNNER_TEMP "FreeBASIC"
        New-Item -ItemType Directory -Force -Path $installRoot | Out-Null
        Expand-Archive -Path $archive -DestinationPath $installRoot -Force

        $fbcRoot = Join-Path $installRoot "FreeBASIC-1.10.1-win64"
        $fbc = Join-Path $fbcRoot "fbc.exe"
        if (-not (Test-Path $fbc)) {
          throw "FreeBASIC compiler (fbc.exe) was not found under $fbcRoot"
        }

        "FBC_PATH=$fbc" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        "PATH=$fbcRoot;$fbcRoot\bin\win64;$env:PATH" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        & $fbc -version

    - name: Compile all FreeBasicNanoMsg examples
      shell: pwsh
      working-directory: ./FreeBasicNanoMsg/Example
      run: |
        $outDir = Join-Path (Get-Location) "_ci_out"
        New-Item -ItemType Directory -Force -Path $outDir | Out-Null

        $files = @(
          "Nanomsg.bas",
          "PubServer.bas",
          "SubClient.bas",
          "RepServer.bas",
          "ReqClient.bas",
          "PushServer.bas",
          "PullClient.bas",
          "SurveyorServer.bas",
          "RespondentClient.bas",
          "PairInproc.bas",
          "Module/PubServer.bas",
          "Module/SubClient.bas",
          "Module/RepServer.bas",
          "Module/ReqClient.bas",
          "Module/PushServer.bas",
          "Module/PullClient.bas",
          "Module/SurveyorServer.bas",
          "Module/RespondentClient.bas",
          "Module/PairInproc.bas"
        )

        $failed = @()
        foreach ($f in $files) {
          $name = ($f -replace '[\\/]', '-').Replace('.bas', '')
          $dst = Join-Path $outDir "$name.exe"
          Write-Host "=== Compiling $f ==="
          & $env:FBC_PATH -w all $f -target win64 -x $dst
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $dst)) {
            Write-Host "FAILED: $f"
            $failed += $f
          } else {
            Write-Host "OK: $f"
          }
        }

        if ($failed.Count -gt 0) {
          Write-Error ("Compilation failed for: " + ($failed -join ", "))
          exit 1
        }
        Write-Host "Compiled $($files.Count) FreeBasicNanoMsg examples."

    - name: Build and run FreeBasicNanoMsg smoke test
      shell: pwsh
      working-directory: ./FreeBasicNanoMsg
      run: |
        if (-not (Test-Path "Library/x64/nanomsg.dll")) {
          throw "Bundled Library/x64/nanomsg.dll is missing."
        }

        & $env:FBC_PATH -w all Test/Smoke.bas -target win64 -x Test/Smoke.exe
        if ($LASTEXITCODE -ne 0) {
          exit $LASTEXITCODE
        }

        & .\Test\Smoke.exe
        if ($LASTEXITCODE -ne 0) {
          Write-Error "FreeBasicNanoMsg smoke test failed with exit code $LASTEXITCODE"
          exit $LASTEXITCODE
        }
        Write-Host "FreeBasicNanoMsg smoke test passed."

    - name: Build and run FreeBasicNNG Tests
      shell: pwsh
      working-directory: ./FreeBasicNNG
      run: |
        & $env:FBC_PATH -w all Test/NngTest.bas -target win64 -x Test/NngTest.exe
        if ($LASTEXITCODE -ne 0) {
          exit $LASTEXITCODE
        }

        & .\Test\NngTest.exe
        if ($LASTEXITCODE -ne 0) {
          exit $LASTEXITCODE
        }
